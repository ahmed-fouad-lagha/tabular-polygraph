[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-polygraph"
version = "0.1.0"
description = "HIF: Hybrid Integrity Framework for Synthetic Tabular Data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ahmed Fouad Lagha" },
    { name = "Zakarya Farou" },
    { name = "Imre Lendák" }
]
dependencies = [
    "numpy>=1.23,<3",
    "pandas>=1.5,<3",
    "scipy>=1.9,<2",
    "pyarrow>=12",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
    "xgboost>=2.0,<3.3",
    "scikit-learn>=1.3,<1.9",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov"
]
vine = [
    "pyvinecopulib==0.7.5"
]
ctgan = [
    "ctgan==0.11.1",
    "torch>=1.13"
]
tvae = [
    "sdv==1.32.0",
    "torch>=1.13"
]
lint = [
    "pre-commit"
]
dev = [
    "tabular-polygraph[test,lint]",
    "build",
    "twine"
]

[project.scripts]
tabular-polygraph = "tabular_polygraph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tabular_polygraph*"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["tabular_polygraph", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["tabular_polygraph"]

[tool.coverage.run]
source = ["tabular_polygraph"]
omit = [
    "tabular_polygraph/cli/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError:",
    "pass"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.mypy]
ignore_missing_imports = true
